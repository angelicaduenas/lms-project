<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mews Learning Hub</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
--surface-0:#f5f3ee;--surface-1:#f0ede6;--surface-2:#ffffff;--surface-3:#ffffff;
--text-primary:#0b0b0d;--text-secondary:#5a5a5a;--text-muted:#9a9a9a;
--border:rgba(0,0,0,0.1);--border-strong:rgba(0,0,0,0.18);
--fill-accent:#3b82f6;--on-accent:#fff;--bg-accent:#eff6ff;--text-accent:#1d4ed8;--border-accent:#bfdbfe;
--fill-success:#22c55e;--on-success:#fff;--bg-success:#f0fdf4;--text-success:#15803d;--border-success:#bbf7d0;
--fill-warning:#f59e0b;--on-warning:#fff;--bg-warning:#fffbeb;--text-warning:#b45309;--border-warning:#fde68a;
--fill-danger:#ef4444;--on-danger:#fff;--bg-danger:#fef2f2;--text-danger:#b91c1c;--border-danger:#fecaca;
--font-sans:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;--font-mono:'SF Mono','Fira Code',monospace;
--radius:8px;
}
[data-mode="dark"]{
--surface-0:#0b0b0d;--surface-1:#141416;--surface-2:#1c1c1f;--surface-3:#242428;
--text-primary:#f5f3ee;--text-secondary:#a0a0a0;--text-muted:#606060;
--border:rgba(255,255,255,0.1);--border-strong:rgba(255,255,255,0.18);
--bg-accent:#1e3a5f;--text-accent:#60a5fa;--border-accent:#1e40af;
--bg-success:#052e16;--text-success:#4ade80;--border-success:#14532d;
--bg-warning:#1c1200;--text-warning:#fbbf24;--border-warning:#92400e;
--bg-danger:#2d0a0a;--text-danger:#f87171;--border-danger:#7f1d1d;
}
body{font-family:var(--font-sans);font-size:13px;color:var(--text-primary);background:var(--surface-0);display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px}
::-webkit-scrollbar{width:3px;height:3px}::-webkit-scrollbar-thumb{background:var(--border-strong);border-radius:2px}
.shell{display:flex;height:700px;width:100%;max-width:960px;background:var(--surface-0);border:0.5px solid var(--border);border-radius:14px;overflow:hidden;box-shadow:0 4px 32px rgba(0,0,0,0.08)}
.sn{width:48px;background:var(--surface-1);border-right:0.5px solid var(--border);display:flex;flex-direction:column;align-items:center;padding:10px 0;gap:1px;flex-shrink:0}
.snb{width:34px;height:34px;border-radius:8px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--text-secondary);border:none;background:none}
.snb:hover{background:var(--surface-2)}.snb.on{background:var(--bg-accent);color:var(--text-accent)}.snb i{font-size:17px}
.sndiv{width:26px;height:0.5px;background:var(--border);margin:4px 0}
.logo{width:26px;height:26px;border-radius:6px;background:var(--text-primary);display:flex;align-items:center;justify-content:center;margin-bottom:8px;cursor:pointer;flex-shrink:0}
.main{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0}
.topbar{height:44px;background:var(--surface-2);border-bottom:0.5px solid var(--border);display:flex;align-items:center;padding:0 14px;gap:8px;flex-shrink:0}
.tb-ttl{font-size:12px;font-weight:500;color:var(--text-primary)}
.tb-search{display:flex;align-items:center;gap:5px;background:var(--surface-1);border:0.5px solid var(--border);border-radius:6px;padding:4px 9px;flex:1;max-width:260px;margin-left:auto}
.tb-search input{background:none;border:none;outline:none;font-size:11px;color:var(--text-primary);font-family:inherit;width:100%}
.tb-search input::placeholder{color:var(--text-muted)}
.tbx{background:none;border:none;cursor:pointer;color:var(--text-secondary);padding:3px;border-radius:4px;display:flex;align-items:center}
.tbx:hover{background:var(--surface-1)}.tbx i{font-size:15px}
.ava{width:22px;height:22px;border-radius:50%;background:var(--fill-accent);color:var(--on-accent);display:flex;align-items:center;justify-content:center;font-size:8px;font-weight:500;cursor:pointer;flex-shrink:0}
.screen{flex:1;overflow:hidden;display:flex;flex-direction:column}
.pad{padding:14px}.scr{flex:1;overflow-y:auto}
.seclbl{font-size:9px;font-weight:500;letter-spacing:.9px;color:var(--text-muted);margin-bottom:8px}
.card{background:var(--surface-2);border:0.5px solid var(--border);border-radius:10px}
.pill{font-size:9px;font-weight:500;padding:2px 7px;border-radius:8px;display:inline-block;white-space:nowrap}
.p-live{background:var(--bg-danger);color:var(--text-danger)}.p-draft{background:var(--bg-warning);color:var(--text-warning)}
.p-rev{background:var(--bg-accent);color:var(--text-accent)}.p-done{background:var(--bg-success);color:var(--text-success)}
.p-beg{background:var(--bg-success);color:var(--text-success)}.p-int{background:var(--bg-warning);color:var(--text-warning)}.p-adv{background:var(--bg-danger);color:var(--text-danger)}
.row{display:flex;align-items:center;gap:8px;padding:8px;border-bottom:0.5px solid var(--border)}.row:last-child{border-bottom:none}.row:hover{background:var(--surface-1)}
.btn{font-size:10px;font-weight:500;padding:5px 11px;border-radius:6px;cursor:pointer;border:none;font-family:inherit}
.btn-p{background:var(--fill-accent);color:var(--on-accent)}.btn-s{background:transparent;border:0.5px solid var(--border);color:var(--text-primary)}.btn-d{background:var(--fill-danger);color:var(--on-danger)}
.tabrow{display:flex;border-bottom:0.5px solid var(--border);flex-shrink:0;overflow-x:auto}
.tab{background:none;border:none;cursor:pointer;font-family:inherit;font-size:11px;font-weight:500;padding:7px 10px;color:var(--text-secondary);border-bottom:2px solid transparent;white-space:nowrap}
.tab.on{color:var(--text-accent);border-bottom-color:var(--fill-accent)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.stat{background:var(--surface-2);border:0.5px solid var(--border);border-radius:9px;padding:10px;text-align:center}
.stat-n{font-size:16px;font-weight:500;color:var(--text-primary)}.stat-l{font-size:9px;color:var(--text-secondary);margin-top:2px}
.notif-dot{width:7px;height:7px;border-radius:50%;background:var(--fill-danger);position:absolute;top:5px;right:5px}.rel{position:relative}
.at-risk-banner{background:var(--bg-warning);border-bottom:0.5px solid var(--border-warning);padding:8px 14px;display:flex;align-items:center;gap:8px;font-size:11px;flex-shrink:0}
.pbar{height:3px;border-radius:2px;background:var(--border-strong);overflow:hidden}.pbar-f{height:100%;border-radius:2px;background:var(--fill-accent)}
.sbar{flex:1;height:5px;border-radius:3px;background:var(--border-strong);overflow:hidden}.sbar-f{height:100%;border-radius:3px}
.mods{width:210px;flex-shrink:0;background:var(--surface-2);border-left:0.5px solid var(--border);overflow-y:auto}
.mod-r{display:flex;align-items:center;gap:7px;padding:7px 10px;border-bottom:0.5px solid var(--border);cursor:pointer}
.mod-r:hover{background:var(--surface-1)}.mod-r.act{background:var(--bg-accent)}.mod-r.act .mod-t{color:var(--text-accent);font-weight:500}
.mod-t{font-size:10px;color:var(--text-primary);flex:1;line-height:1.3}.mod-n{font-size:9px;color:var(--text-muted);width:14px;text-align:center;flex-shrink:0}
.chk{width:13px;height:13px;border-radius:50%;border:0.5px solid var(--border-strong);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.chk.ok{background:var(--fill-success);border-color:var(--fill-success)}.chk.ok i{font-size:8px;color:var(--on-success)}
.player-area{flex:1;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:10px;background:linear-gradient(135deg,#0f172a,#1e3a5f);position:relative;min-height:0}
.play-big{width:52px;height:52px;border-radius:50%;background:rgba(255,255,255,.18);border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;color:#fff}
.ctrl-bar{background:#111;padding:8px 14px;display:flex;align-items:center;gap:8px;flex-shrink:0}
.ctrl-b{background:none;border:none;cursor:pointer;color:#aaa;display:flex;align-items:center;padding:3px}.ctrl-b i{font-size:15px}
.prog-t{flex:1;height:3px;background:rgba(255,255,255,.2);border-radius:2px;cursor:pointer}.prog-p{height:100%;border-radius:2px;background:#60a5fa;transition:width .3s}
.wpanel{width:210px;flex-shrink:0;background:var(--surface-1);border-left:0.5px solid var(--border);display:flex;flex-direction:column;overflow:hidden}
.wptabs{display:flex;border-bottom:0.5px solid var(--border);flex-shrink:0}
.wptab{flex:1;background:none;border:none;cursor:pointer;font-family:inherit;font-size:10px;font-weight:500;padding:7px 4px;color:var(--text-secondary);border-bottom:2px solid transparent}
.wptab.on{color:var(--text-accent);border-bottom-color:var(--fill-accent)}
.wpbody{flex:1;overflow-y:auto;padding:8px}
.wacc{background:var(--surface-2);border:0.5px solid var(--border);border-radius:8px;overflow:hidden;margin-bottom:6px}
.wacc-h{display:flex;align-items:center;gap:6px;padding:7px 9px;cursor:pointer}.wacc-h:hover{background:var(--surface-1)}
.wacc-ic{width:20px;height:20px;border-radius:5px;display:flex;align-items:center;justify-content:center;font-size:11px;flex-shrink:0}
.wacc-ttl{font-size:10px;font-weight:500;color:var(--text-primary);flex:1}.wacc-chv{font-size:10px;color:var(--text-muted);transition:transform .18s}.wacc-chv.op{transform:rotate(180deg)}
.wacc-b{display:none;padding:0 9px 9px;border-top:0.5px solid var(--border)}.wacc-b.op{display:block}
.tgl{width:26px;height:15px;border-radius:8px;position:relative;cursor:pointer;transition:background .2s;flex-shrink:0}
.tgl.on{background:var(--fill-accent)}.tgl.off{background:var(--border-strong)}
.tgl-k{position:absolute;top:2px;width:11px;height:11px;border-radius:50%;background:#fff;transition:left .2s}
.tgl.on .tgl-k{left:13px}.tgl.off .tgl-k{left:2px}
.msgs{display:flex;flex-direction:column;gap:4px;max-height:110px;overflow-y:auto;margin-bottom:5px;padding-top:5px}
.mb .bub{background:var(--bg-accent);color:var(--text-primary);border-radius:7px 7px 7px 2px}
.mu{text-align:right}.mu .bub{background:var(--fill-accent);color:var(--on-accent);border-radius:7px 7px 2px 7px}
.bub{display:inline-block;padding:4px 7px;font-size:10px;line-height:1.45;max-width:92%}
.minp{display:flex;gap:4px;border-top:0.5px solid var(--border);padding-top:5px}
.minp input{flex:1;font-size:10px;padding:3px 7px;border-radius:10px;border:0.5px solid var(--border);background:var(--surface-1);color:var(--text-primary);outline:none;font-family:inherit}
.minp input:focus{border-color:var(--fill-accent)}.minp button{width:20px;height:20px;border-radius:50%;background:var(--fill-accent);border:none;cursor:pointer;font-size:10px;flex-shrink:0;color:var(--on-accent)}
.qopt{width:100%;text-align:left;background:var(--surface-1);border:0.5px solid var(--border);border-radius:6px;padding:5px 8px;font-size:10px;color:var(--text-primary);cursor:pointer;font-family:inherit;margin-bottom:4px;transition:all .15s;display:flex;align-items:center;gap:6px}
.qopt:hover{border-color:var(--fill-accent)}.qopt.ok{border-color:var(--fill-success);background:var(--bg-success);color:var(--text-success)}.qopt.bad{border-color:var(--fill-danger);background:var(--bg-danger);color:var(--text-danger)}.qopt.dis{pointer-events:none}
.ql{width:14px;height:14px;border-radius:50%;background:var(--border-strong);display:flex;align-items:center;justify-content:center;font-size:7px;font-weight:500;flex-shrink:0}
.qopt.ok .ql{background:var(--fill-success)}.qopt.bad .ql{background:var(--fill-danger);color:#fff}
.timer-ring{display:flex;justify-content:center;margin:4px 0}
.tc{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.lb-row{display:flex;align-items:center;gap:7px;padding:5px 0;border-bottom:0.5px solid var(--border)}.lb-row:last-child{border-bottom:none}
.lb-row.me{background:var(--bg-accent);border-radius:6px;padding:5px 6px;margin:2px -6px}
.lba{width:20px;height:20px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:8px;font-weight:500;flex-shrink:0}
.asn{width:152px;flex-shrink:0;background:var(--surface-1);border-right:0.5px solid var(--border);overflow-y:auto;padding:8px 0}
.asn-s{font-size:9px;font-weight:500;letter-spacing:.7px;color:var(--text-muted);padding:0 10px 5px;margin-top:5px}
.asnl{width:100%;background:none;border:none;cursor:pointer;font-family:inherit;font-size:10px;padding:6px 10px;text-align:left;display:flex;align-items:center;gap:6px;color:var(--text-secondary);border-right:2px solid transparent}
.asnl i{font-size:13px}.asnl:hover{background:var(--surface-2);color:var(--text-primary)}.asnl.on{color:var(--text-primary);font-weight:500;border-right-color:var(--fill-accent);background:var(--bg-accent)}
.brow{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.bname{font-size:10px;color:var(--text-secondary);width:130px;flex-shrink:0;text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.btrack{flex:1;height:12px;border-radius:3px;background:var(--surface-1);overflow:hidden}
.bfill{height:100%;border-radius:3px;background:var(--fill-accent);display:flex;align-items:center;justify-content:flex-end;padding-right:3px}
.bval{font-size:8px;font-weight:500;color:var(--on-accent)}
.nl-input{display:flex;gap:6px;margin-bottom:8px}
.nl-input input{flex:1;font-size:11px;padding:6px 10px;border-radius:7px;border:0.5px solid var(--border);background:var(--surface-2);color:var(--text-primary);outline:none;font-family:inherit}
.nl-input input:focus{border-color:var(--fill-accent)}.nl-input button{font-size:10px;font-weight:500;padding:6px 12px;border-radius:7px;background:var(--fill-accent);color:var(--on-accent);border:none;cursor:pointer;font-family:inherit;white-space:nowrap}
code{font-size:9px;padding:2px 5px;background:var(--surface-1);border-radius:4px;font-family:var(--font-mono);color:var(--text-secondary)}
pre{font-size:9px;background:var(--surface-2);border:0.5px solid var(--border);border-radius:8px;padding:10px;font-family:var(--font-mono);color:var(--text-primary);line-height:1.7;overflow:auto}
.ldot{width:6px;height:6px;border-radius:50%;background:var(--fill-danger);display:inline-block;animation:lp 1.3s ease-in-out infinite;margin-right:4px}
@keyframes lp{0%,100%{opacity:1}50%{opacity:.3}}
.annc{background:rgba(124,58,237,.08);border-bottom:0.5px solid var(--border);padding:7px 14px;display:flex;align-items:center;gap:8px;font-size:11px;flex-shrink:0}
</style>
</head>
<body>
<div class="shell">
<div class="sn">
  <div class="logo"><svg width="11" height="11" viewBox="0 0 14 14" fill="none"><rect x="1" y="1" width="5" height="5" rx="1" fill="white"/><rect x="8" y="1" width="5" height="5" rx="1" fill="white"/><rect x="1" y="8" width="5" height="5" rx="1" fill="white"/><rect x="8" y="8" width="5" height="5" rx="1" fill="white"/></svg></div>
  <button class="snb on" onclick="go('dash')" id="sn-dash" title="Dashboard"><i class="ti ti-layout-dashboard"></i></button>
  <button class="snb" onclick="go('catalog')" id="sn-catalog" title="Catalog"><i class="ti ti-book-2"></i></button>
  <button class="snb" onclick="go('player')" id="sn-player" title="Course player"><i class="ti ti-player-play"></i></button>
  <button class="snb" onclick="go('mylearn')" id="sn-mylearn" title="My learning"><i class="ti ti-award"></i></button>
  <button class="snb" onclick="go('live')" id="sn-live" title="Live sessions"><i class="ti ti-video"></i></button>
  <button class="snb" onclick="go('lb')" id="sn-lb" title="Leaderboard"><i class="ti ti-trophy"></i></button>
  <button class="snb rel" onclick="go('notif')" id="sn-notif" title="Notifications"><i class="ti ti-bell"></i><div class="notif-dot"></div></button>
  <div class="sndiv"></div>
  <button class="snb" onclick="go('admin')" id="sn-admin" title="Admin"><i class="ti ti-settings"></i></button>
  <div style="flex:1"></div>
  <div class="ava">AG</div>
</div>
<div class="main">
  <div class="topbar">
    <span class="tb-ttl" id="tb-t">Dashboard</span>
    <div class="tb-search"><i class="ti ti-search" style="font-size:12px;color:var(--text-muted)"></i><input placeholder="Search courses, certs…"/></div>
    <button class="tbx" onclick="document.documentElement.setAttribute('data-mode',document.documentElement.getAttribute('data-mode')==='dark'?'light':'dark')" title="Toggle dark mode"><i class="ti ti-moon"></i></button>
  </div>
  <div class="screen" id="scr"></div>
</div>
</div>
<script>
const T={dash:'Dashboard',catalog:'Course catalog',player:'Course player',mylearn:'My learning',live:'Live sessions',lb:'Leaderboard',notif:'Notifications',admin:'Admin'};
function go(id){document.querySelectorAll('.snb').forEach(b=>b.classList.remove('on'));const b=document.getElementById('sn-'+id);if(b)b.classList.add('on');document.getElementById('tb-t').textContent=T[id]||id;const s=document.getElementById('scr');s.innerHTML='';s.style.flexDirection='column';s.style.overflow='hidden';({dash:buildDash,catalog:buildCatalog,player:buildPlayer,mylearn:buildMylearn,live:buildLive,lb:buildLB,notif:buildNotif,admin:buildAdmin})[id]?.(s);}
const fmt=s=>Math.floor(s/60)+':'+(s%60<10?'0':'')+s%60;
function donut(pct,r,color,val,sub,label){const c=2*Math.PI*r,dash=c*pct/100,gap=c-dash,sz=r*2+8;return`<div class="stat" style="display:flex;flex-direction:column;align-items:center;gap:3px"><div style="position:relative;width:${sz}px;height:${sz}px"><svg width="${sz}" height="${sz}" viewBox="0 0 ${sz} ${sz}"><circle cx="${r+4}" cy="${r+4}" r="${r}" fill="none" stroke="var(--border-strong)" stroke-width="4"/><circle cx="${r+4}" cy="${r+4}" r="${r}" fill="none" stroke="${color}" stroke-width="4" stroke-dasharray="${dash.toFixed(1)} ${gap.toFixed(1)}" stroke-linecap="round" transform="rotate(-90 ${r+4} ${r+4})"/></svg><div style="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center"><div style="font-size:12px;font-weight:500;color:var(--text-primary);line-height:1">${val}</div><div style="font-size:8px;color:var(--text-muted)">${sub}</div></div></div><div style="font-size:9px;color:var(--text-secondary);text-align:center">${label}</div></div>`;}
function lpc(e,bg,t,s,p){return`<div class="card" style="padding:9px 10px;display:flex;align-items:center;gap:9px;margin-bottom:6px"><div style="width:26px;height:26px;border-radius:6px;background:${bg};display:flex;align-items:center;justify-content:center;font-size:13px;flex-shrink:0">${e}</div><div style="flex:1;min-width:0"><div style="font-size:11px;font-weight:500;color:var(--text-primary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${t}</div><div style="font-size:9px;color:var(--text-muted);margin-bottom:3px">${s}</div><div class="pbar"><div class="pbar-f" style="width:${p}%"></div></div></div><div style="font-size:10px;font-weight:500;color:var(--text-accent)">${p}%</div></div>`;}
function task(t,s,d,sev){return`<div class="card" style="padding:8px 10px;display:flex;align-items:center;gap:8px;margin-bottom:6px;background:var(--bg-${sev});border-color:var(--border-${sev})"><i class="ti ti-clock" style="font-size:14px;color:var(--text-${sev})"></i><div style="flex:1"><div style="font-size:11px;font-weight:500;color:var(--text-primary)">${t}</div><div style="font-size:10px;color:var(--text-secondary)">${s}</div></div><div style="font-size:10px;font-weight:500;color:var(--text-${sev})">${d}</div></div>`;}
function wacc(id,ic,bg,title,body){return`<div class="wacc"><div class="wacc-h" onclick="toggleWacc('wb-${id}','wc-${id}')"><div class="wacc-ic" style="background:${bg}">${ic}</div><span class="wacc-ttl">${title}</span><span class="wacc-chv" id="wc-${id}">▾</span></div><div class="wacc-b" id="wb-${id}">${body}</div></div>`;}
function toggleWacc(bid,cid){const b=document.getElementById(bid),ch=document.getElementById(cid);if(b){b.classList.toggle('op');if(ch)ch.classList.toggle('op');}}

function quizHTML(){if(qDone)return`<div style="padding-top:6px;text-align:center"><div style="font-size:24px;margin-bottom:4px">${qScore===3?'🏆':qScore>=2?'⭐':'💪'}</div><div style="font-size:16px;font-weight:500;color:var(--text-primary)">${qScore}/3</div><div style="font-size:10px;color:var(--text-secondary);margin-bottom:6px">${qScore===3?'Perfect!':'Keep going'} +${qScore*10} XP</div><button class="btn btn-p" onclick="qIdx=0;qAns=false;qScore=0;qDone=false;document.getElementById('wb-quiz').innerHTML=quizHTML()">Try again</button></div>`;const q=QS[qIdx],dots=QS.map((_,i)=>`<div style="width:7px;height:7px;border-radius:50%;background:${i<=qIdx?'var(--fill-accent)':'var(--border-strong)'}"></div>`).join('');return`<div style="padding-top:6px"><div style="font-size:8px;font-weight:500;letter-spacing:.7px;color:var(--text-accent);margin-bottom:5px">✦ AI · RESERVATIONS</div><div style="font-size:11px;font-weight:500;color:var(--text-primary);line-height:1.4;margin-bottom:8px">${q.q}</div><div id="quiz-opts">${q.opts.map((o,i)=>`<button class="qopt" onclick="ansQ(${i})" id="qo-${i}"><div class="ql">${'ABCD'[i]}</div>${o}</button>`).join('')}</div><div id="quiz-fb" style="display:none;font-size:10px;line-height:1.5;padding:6px 8px;border-radius:6px;margin-bottom:6px"></div><div style="display:flex;align-items:center;justify-content:space-between;margin-top:4px"><div style="display:flex;gap:4px">${dots}</div><button id="quiz-next" style="display:none;font-size:10px;font-weight:500;padding:4px 10px;border-radius:14px;background:var(--fill-accent);color:var(--on-accent);border:none;cursor:pointer;font-family:inherit" onclick="nextQ()">${qIdx<QS.length-1?'Next →':'Results →'}</button></div></div>`;}
function ansQ(i){if(qAns)return;qAns=true;const q=QS[qIdx],ok=i===q.c;if(ok)qScore++;document.querySelectorAll('.qopt').forEach((el,j)=>{el.classList.add('dis');if(j===q.c)el.classList.add('ok');if(j===i&&!ok)el.classList.add('bad');});const fb=document.getElementById('quiz-fb');if(fb){fb.style.display='block';fb.style.background=ok?'var(--bg-success)':'var(--bg-danger)';fb.style.color=ok?'var(--text-success)':'var(--text-danger)';fb.textContent=(ok?'Correct! ':'Not quite. ')+q.exp;}const nx=document.getElementById('quiz-next');if(nx)nx.style.display='inline-block';}

let timerSecs=25*60,timerRunning=false,timerMode='focus',tInterval=null,sessions=0,tLog=[];
const TMODES={focus:25*60,short:5*60,long:15*60};
function timerHTML(){const total=TMODES[timerMode],pct=((total-timerSecs)/total)*100,r=28,circ=2*Math.PI*r,offset=circ*(1-pct/100);return`<div style="padding-top:6px;text-align:center"><div style="display:flex;gap:4px;justify-content:center;margin-bottom:7px">${[['focus','Focus 25'],['short','Break 5'],['long','Long 15']].map(([m,l])=>`<button style="font-size:9px;padding:2px 8px;border-radius:12px;border:0.5px solid var(--border);background:${timerMode===m?'var(--fill-accent)':'transparent'};color:${timerMode===m?'var(--on-accent)':'var(--text-secondary)'};cursor:pointer;font-family:inherit" onclick="setTMode('${m}')">${l}</button>`).join('')}</div><div class="timer-ring"><div style="position:relative;width:${(r+4)*2}px;height:${(r+4)*2}px"><svg width="${(r+4)*2}" height="${(r+4)*2}" viewBox="0 0 ${(r+4)*2} ${(r+4)*2}"><circle cx="${r+4}" cy="${r+4}" r="${r}" fill="none" stroke="var(--border-strong)" stroke-width="4"/><circle cx="${r+4}" cy="${r+4}" r="${r}" fill="none" stroke="var(--fill-accent)" stroke-width="4" stroke-dasharray="${circ.toFixed(1)}" stroke-dashoffset="${offset.toFixed(1)}" stroke-linecap="round" transform="rotate(-90 ${r+4} ${r+4})" id="t-arc"/></svg><div class="tc"><div style="font-size:18px;font-weight:500;color:var(--text-primary)" id="t-disp">${fmt(timerSecs)}</div><div style="font-size:9px;color:var(--text-secondary)">${timerMode==='focus'?'Focus':timerMode==='short'?'Short break':'Long break'}</div></div></div></div><div style="display:flex;justify-content:center;gap:8px;margin-bottom:7px"><button style="width:28px;height:28px;border-radius:50%;border:0.5px solid var(--border);background:var(--surface-1);cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--text-primary)" onclick="resetTimer()"><i class="ti ti-refresh" style="font-size:13px"></i></button><button style="width:36px;height:36px;border-radius:50%;background:var(--fill-accent);border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--on-accent)" onclick="toggleTimer()" id="t-btn"><i class="ti ti-player-play" id="t-ic" style="font-size:14px"></i></button><button style="width:28px;height:28px;border-radius:50%;border:0.5px solid var(--border);background:var(--surface-1);cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--text-primary)" onclick="skipTimer()"><i class="ti ti-player-skip-forward" style="font-size:13px"></i></button></div><div style="display:flex;gap:4px;justify-content:center;margin-bottom:7px">${[0,1,2,3].map(i=>`<div style="width:8px;height:8px;border-radius:50%;background:${i<sessions?'var(--fill-accent)':'var(--border-strong)'}"></div>`).join('')}</div>${tLog.length?`<div style="font-size:9px;color:var(--text-secondary);text-align:left;border-top:0.5px solid var(--border);padding-top:5px">${tLog.slice(-2).map(l=>`<div style="margin-bottom:2px">⏱ ${l}</div>`).join('')}</div>`:''}</div>`;}
function toggleTimer(){timerRunning=!timerRunning;const ic=document.getElementById('t-ic');if(ic)ic.className=timerRunning?'ti ti-player-pause':'ti ti-player-play';if(timerRunning){tInterval=setInterval(()=>{timerSecs--;const d=document.getElementById('t-disp');if(d)d.textContent=fmt(timerSecs);const total=TMODES[timerMode],pct=((total-timerSecs)/total)*100,r=28,circ=2*Math.PI*r,arc=document.getElementById('t-arc');if(arc)arc.setAttribute('stroke-dashoffset',(circ*(1-pct/100)).toFixed(1));if(timerSecs<=0)skipTimer();},1000);}else clearInterval(tInterval);}
function resetTimer(){clearInterval(tInterval);timerRunning=false;timerSecs=TMODES[timerMode];refreshTimer();}
function skipTimer(){clearInterval(tInterval);timerRunning=false;if(timerMode==='focus'){sessions=Math.min(4,sessions+1);const now=new Date();tLog.push(`Focus 25min · ${now.getHours()}:${String(now.getMinutes()).padStart(2,'0')}`);}timerMode=timerMode==='focus'?'short':'focus';timerSecs=TMODES[timerMode];refreshTimer();}
function setTMode(m){clearInterval(tInterval);timerRunning=false;timerMode=m;timerSecs=TMODES[m];refreshTimer();}

p-draft'}">${status}</span></td><td style="padding:6px 8px;border-bottom:0.5px solid var(--border);font-size:10px;color:var(--text-muted)">${ll}</td><td style="padding:6px 8px;border-bottom:0.5px solid var(--border)"><button style="background:none;border:none;cursor:pointer;color:var(--text-muted);font-size:12px">⋯</button></td></tr>`).join('')}</tbody></table>`;}
else if(s==='publisher'){c.innerHTML=`<div class="seclbl">PUBLISH A NEW COURSE</div><div class="grid3" style="margin-bottom:14px">${[['ti-file-zip','Upload ZIP','SCORM · xAPI · cmi5'],['ti-link','From link','Evolve · SharePoint · Blob'],['ti-code','REST API','POST /api/v1/courses']].map(([ic,t,sb])=>`<div class="card" style="padding:12px;cursor:pointer"><i class="ti ${ic}" style="font-size:18px;color:var(--text-accent);display:block;margin-bottom:7px"></i><div style="font-size:11px;font-weight:500;color:var(--text-primary);margin-bottom:2px">${t}</div><div style="font-size:9px;color:var(--text-secondary)">${sb}</div></div>`).join('')}</div><div style="border:1.5px dashed var(--border-strong);border-radius:10px;padding:22px;text-align:center;cursor:pointer;background:var(--surface-1)" id="dz" onclick="scanDrop()"><i class="ti ti-file-zip" style="font-size:26px;color:var(--text-accent);display:block;margin-bottom:7px"></i><div style="font-size:12px;font-weight:500;color:var(--text-primary);margin-bottom:3px">Drop your package here or click to browse</div><div style="font-size:10px;color:var(--text-secondary)">Claude auto-generates title, description, level and tags from the manifest</div></div><div id="pub-fields" style="display:none;margin-top:12px"><div class="grid2" style="margin-bottom:8px"><div><div style="font-size:9px;color:var(--text-muted);margin-bottom:3px">TITLE <span style="color:var(--text-accent)">✦ AI</span></div><input style="width:100%;font-size:11px;padding:6px 9px;border-radius:7px;border:0.5px solid var(--border);background:var(--surface-2);color:var(--text-primary);outline:none;font-family:inherit" value="Reservations & Check-in — Full Workflow"/></div><div><div style="font-size:9px;color:var(--text-muted);margin-bottom:3px">LEVEL <span style="color:var(--text-accent)">✦ AI</span></div><select style="width:100%;font-size:11px;padding:6px 9px;border-radius:7px;border:0.5px solid var(--border);background:var(--surface-2);color:var(--text-primary);font-family:inherit"><option>Beginner</option><option>Intermediate</option><option>Advanced</option></select></div></div><button class="btn btn-p" style="width:100%" id="pub-go" onclick="runPublish()"><i class="ti ti-rocket" style="font-size:11px"></i> Publish course</button></div>`;}
else if(s==='lps'){c.innerHTML=`<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px"><div class="seclbl" style="margin-bottom:0">LEARNING PATHS</div><button class="btn btn-p" style="font-size:9px">Create LP</button></div>${[['🏨','#F0EDFF','Front Office Essentials','8 courses · prerequisite-gated','live',342],['💳','#FFEEF8','Payments & Billing Mastery','7 courses · no prereqs','live',156],['📊','#EDF7FF','Business Intelligence Track','6 courses · FO required','live',89],['🔒','#F0EDFF','Compliance & Security','5 courses · all staff','live',201],['🔗','#FFF8E1','Integrations Specialist','5 courses · intermediate','draft',0]].map(([e,bg,t,sb,st,co])=>`<div class="card" style="padding:10px;display:flex;align-items:center;gap:9px;margin-bottom:7px"><div style="width:28px;height:28px;border-radius:7px;background:${bg};display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0">${e}</div><div style="flex:1"><div style="font-size:11px;font-weight:500;color:var(--text-primary)">${t}</div><div style="font-size:9px;color:var(--text-secondary)">${sb}</div></div><span class="pill ${st==='live'?'p-done':'p-draft'}">${st}</span><span style="font-size:10px;color:var(--text-muted)">${co} enrolled</span><button style="background:none;border:none;cursor:pointer;color:var(--text-muted);font-size:12px">⋯</button></div>`).join('')}`;}
else if(s==='audit'){c.innerHTML=`<div class="seclbl">AUDIT LOG — immutable, retained 7 years</div><table style="width:100%;border-collapse:collapse"><thead><tr>${['Actor','Action','Entity','Time'].map(h=>`<th style="font-size:9px;font-weight:500;color:var(--text-muted);text-align:left;padding:5px 8px;border-bottom:0.5px solid var(--border)">${h}</th>`).join('')}</tr></thead><tbody>${[['Angelica García','enrollment.reset','Reservations · Ana López','2 min ago'],['System (PMS)','user.provisioned','Maria Santos · Wanderlust','14 min ago'],['Angelica García','content.published','AI Tools v1.2','1 hour ago'],['System (PMS)','user.deprovisioned','Former employee · HQ','3 hours ago'],['Angelica García','gdpr.export_requested','Ana López','Yesterday']].map(([a,act,e,t])=>`<tr onmouseover="this.style.background='var(--surface-1)'" onmouseout="this.style.background=''"><td style="padding:5px 8px;border-bottom:0.5px solid var(--border);font-size:10px;font-weight:500">${a}</td><td style="padding:5px 8px;border-bottom:0.5px solid var(--border)"><code>${act}</code></td><td style="padding:5px 8px;border-bottom:0.5px solid var(--border);font-size:9px;color:var(--text-secondary)">${e}</td><td style="padding:5px 8px;border-bottom:0.5px solid var(--border);font-size:9px;color:var(--text-muted)">${t}</td></tr>`).join('')}</tbody></table>`;}
else if(s==='api'){c.innerHTML=`<div class="seclbl">API & WEBHOOKS</div><div class="grid2" style="margin-bottom:12px"><div class="stat" style="text-align:left;padding:10px"><div style="font-size:9px;color:var(--text-muted);margin-bottom:5px">BASE URL</div><code>/api/v1/</code></div><div class="stat" style="text-align:left;padding:10px"><div style="font-size:9px;color:var(--text-muted);margin-bottom:5px">AUTH</div><code>Authorization: Bearer {token}</code></div></div><div class="seclbl">ACTIVE WEBHOOKS</div>${[['enrollment.completed','https://tools.mews.com/lms-events'],['user.at_risk','https://slack-hook.mews.com/alerts'],['certificate.issued','https://sf.mews.com/webhook'],['user.provisioned','https://databricks.mews.com/sync']].map(([e,u])=>`<div class="card" style="padding:8px;display:flex;align-items:center;gap:8px;margin-bottom:5px"><div style="flex:1"><div style="font-size:10px;font-weight:500;color:var(--text-primary);margin-bottom:1px">${e}</div><div style="font-size:9px;color:var(--text-secondary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${u}</div></div><span class="pill p-done">Active</span></div>`).join('')}<div class="seclbl" style="margin-top:10px">OAUTH SCOPES</div><div style="display:flex;flex-wrap:wrap;gap:4px">${['read:users','write:users','read:enrollments','write:enrollments','read:reports','read:content','write:content','webhooks:manage'].map(s=>`<code>${s}</code>`).join('')}</div>`;}
else if(s==='lrs'){c.innerHTML=`<div class="grid4" style="margin-bottom:12px"><div class="stat"><div class="stat-n">48,291</div><div class="stat-l">Total statements</div></div><div class="stat"><div class="stat-n">1,240</div><div class="stat-l">This week</div></div><div class="stat"><div class="stat-n">3</div><div class="stat-l">Streams</div></div><div class="stat"><div class="stat-n">✓</div><div class="stat-l">Connected</div></div></div><div class="seclbl">RECENT xAPI STATEMENTS</div><pre>{\n  "actor": { "name": "Angelica García" },\n  "verb": { "id": "http://adlnet.gov/expapi/verbs/completed" },\n  "object": { "id": "https://lms.mews.com/courses/reservations" },\n  "result": { "score": { "scaled": 0.95 }, "completion": true },\n  "timestamp": "2026-08-26T09:14:22Z"\n}</pre>`;}
else if(s==='gdpr'){c.innerHTML=`<div class="seclbl">GDPR & PRIVACY</div><div style="background:var(--bg-accent);border:0.5px solid var(--border-accent);border-radius:8px;padding:9px;display:flex;align-items:center;gap:8px;margin-bottom:12px;font-size:11px"><i class="ti ti-shield" style="color:var(--text-accent);font-size:15px"></i>EU-first · AES-256 at rest · TLS 1.3 · ISO 27001:2022</div><div class="seclbl">DATA REQUESTS</div>${[['Ana López','Export requested','2026-08-25','Pending'],['Carlos Ruiz','Erasure completed','2026-08-10','Done'],['Emma Johansson','Export completed','2026-08-01','Done']].map(([n,t,d,s])=>`<div class="card" style="padding:8px;display:flex;align-items:center;gap:8px;margin-bottom:5px"><i class="ti ti-shield" style="font-size:14px;color:var(--text-accent)"></i><div style="flex:1"><div style="font-size:11px;font-weight:500;color:var(--text-primary)">${n} — ${t}</div><div style="font-size:9px;color:var(--text-muted)">${d}</div></div><span class="pill ${s==='Done'?'p-done':'p-draft'}">${s}</span></div>`).join('')}<button class="btn btn-p" style="margin-top:8px;font-size:9px">New erasure request</button>`;}
else if(s==='notifmgr'){c.innerHTML=`<div class="seclbl">NOTIFICATION TEMPLATES</div>${[['Enrollment created','Welcome email on LP enrollment'],['Certificate expiring 30d','Re-certification reminder'],['At-risk learner','Manager alert when learner falls behind'],['New content published','Catalog notification to assigned users'],['Completion celebration','Badge + XP award email'],['Assessment failed','Retry encouragement to learner']].map(([t,s])=>`<div class="card" style="padding:8px;display:flex;align-items:center;gap:8px;margin-bottom:5px"><i class="ti ti-mail" style="font-size:14px;color:var(--text-accent)"></i><div style="flex:1"><div style="font-size:11px;font-weight:500;color:var(--text-primary)">${t}</div><div style="font-size:9px;color:var(--text-secondary)">${s}</div></div><span class="pill p-done">Active</span><button class="btn btn-s" style="font-size:9px">Edit</button></div>`).join('')}<div style="margin-top:10px;padding:9px;background:var(--surface-1);border:0.5px solid var(--border);border-radius:8px;font-size:10px;color:var(--text-secondary);line-height:1.5">14 trigger types · Language-aware · Frequency caps · GDPR compliant</div>`;}
else if(s==='enroll'){c.innerHTML=`<div class="seclbl">MANUAL ENROLLMENT</div><pre>POST /api/v1/admin/enrollments\n\n{\n  "user_id": "uuid",\n  "course_id": "uuid",\n  "due_date": "2026-12-31",\n  "notify_learner": true\n}\n\nResponse 201:\n{\n  "enrollment_id": "uuid",\n  "status": "not_started",\n  "welcome_email_queued": true\n}</pre><div class="seclbl" style="margin-top:10px">COMPLETION RECORD MANAGEMENT</div>${['Reset learner progress on a course','Delete a single completion record','Full LP progress reset','Re-use an account (archive + new email)'].map(a=>`<div class="card" style="padding:8px;display:flex;align-items:center;gap:8px;margin-bottom:5px"><i class="ti ti-settings" style="font-size:13px;color:var(--text-accent)"></i><span style="font-size:11px;color:var(--text-primary);flex:1">${a}</span><button class="btn btn-s" style="font-size:9px">Run</button></div>`).join('')}`;}
}
const NL_DEMO={'who completed mews basics this month':'23 employees completed Mews Basics in July 2026. Most recent: James Okafor (today, 09:14). Completion rate 92% — above the 78% platform average.','courses with lowest completion':'AI Tools (22%) · Third-Party Connections (31%) · Business Intel (44%). All published in the last 30 days — consider targeted outreach.','top 10 most active learners':'Maria Santos leads with 22 completions, James Okafor (18), Tomáš Novák (16). Angelica García is #6 with 14.','average score by department':'L&D: 91.2% · Front Office: 88.4% · Payments: 82.1% · Operations: 74.8% — refresher playlist recommended for Operations.'};
function runNL(){const inp=document.getElementById('nl-inp');const res=document.getElementById('nl-res');if(!inp||!res)return;const q=inp.value.trim().toLowerCase();if(!q)return;res.innerHTML='<div style="font-size:10px;color:var(--text-accent);margin-bottom:5px">Generating SQL and running query…</div>';setTimeout(()=>{const ans=Object.entries(NL_DEMO).find(([k])=>q.includes(k.split(' ')[0])&&q.includes(k.split(' ').slice(-1)[0]));res.innerHTML=`<div style="background:var(--bg-success);border:0.5px solid var(--border-success);border-radius:8px;padding:9px;font-size:11px;color:var(--text-primary);line-height:1.6">${ans?ans[1]:'Query executed. Results found — refine with filters for more detail.'}</div>`;},900);}
function scanDrop(){const dz=document.getElementById('dz');dz.innerHTML='<div style="font-size:14px;margin-bottom:5px">✦</div><div style="font-size:11px;font-weight:500;color:var(--text-accent);margin-bottom:2px">Claude generating metadata…</div><div style="font-size:10px;color:var(--text-secondary)">SCORM 1.2 · 8 modules detected</div>';setTimeout(()=>{dz.innerHTML='<div style="font-size:14px;margin-bottom:3px">✅</div><div style="font-size:11px;font-weight:500;color:var(--text-success);margin-bottom:1px">Package ready — reservations-v2.zip</div><div style="font-size:10px;color:var(--text-secondary)">SCORM 1.2 · 8 modules · Metadata generated</div>';const pf=document.getElementById('pub-fields');if(pf)pf.style.display='block';},1400);}
function runPublish(){const btn=document.getElementById('pub-go');if(btn){btn.textContent='Publishing…';btn.disabled=true;}setTimeout(()=>{if(btn){btn.innerHTML='<i class="ti ti-check" style="font-size:11px"></i> Published — course is live';btn.style.background='var(--fill-success)';}},1800);}
go('dash');
</script>
